<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng ký - Lantern</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=2">
<link rel="shortcut icon" href="/static/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="/static/prefs.js?v=3"></script>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<aside class="side"><div class="in">
 <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="var(--acc)"/></svg>Lantern</div>
 <h2>Tạo tài khoản để bắt đầu theo dõi tài sản của bạn.</h2>
 <p>Thêm tên miền hoặc dải IP bạn sở hữu, quét định kỳ và nhận cảnh báo khi có thay đổi.</p>
 <svg class="radar" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--acc)" stop-opacity="0"/><stop offset="1" stop-color="var(--acc)" stop-opacity=".35"/></linearGradient></defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="var(--ring)" stroke-width="1.5"/><circle cx="100" cy="100" r="60" fill="none" stroke="var(--ring)" stroke-width="1.5"/><circle cx="100" cy="100" r="30" fill="none" stroke="var(--ring)" stroke-width="1.5"/>
  <path class="sweep" d="M100 100 L190 100 A90 90 0 0 0 165 36 Z" fill="url(#g)"/>
  <circle cx="140" cy="62" r="5" fill="var(--crit)"/><circle cx="62" cy="128" r="5" fill="var(--ok)"/><circle cx="118" cy="146" r="5" fill="var(--med)"/></svg>
</div></aside>
<main class="form"><div class="card">
 <h1>Đăng ký</h1>
 <p class="sub">Chúng tôi sẽ gửi mã OTP tới email của bạn để xác thực.</p>
 <div class="err" id="err" role="alert" aria-live="assertive"></div>
 <form id="f" novalidate>
  <label class="f"><span class="l">Họ tên</span><span class="inp"><input type="text" name="name" autocomplete="name" maxlength="80" required autofocus></span></label>
  <label class="f"><span class="l">Tên đăng nhập</span><span class="inp"><input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="30" required aria-describedby="unh"></span><span class="hint" id="unh">3–30 ký tự: chữ cái, số, dấu _ hoặc . (không phân biệt hoa thường)</span></label>
  <label class="f"><span class="l">Email</span><span class="inp"><input type="email" name="email" autocomplete="email" maxlength="254" required aria-describedby="emh"></span><span class="hint" id="emh">Mã OTP 6 số sẽ được gửi tới địa chỉ này.</span></label>
  <label class="f"><span class="l">Mật khẩu</span><span class="inp pw"><input type="password" name="password" id="pw" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="pwh"><button type="button" class="eye" id="eye" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button></span>
   <span class="meter" id="meter" data-s="0" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="hint" id="pwh">Tối thiểu 8 ký tự. Nên dùng cụm từ dài, nhiều loại ký tự.</span></label>
  <label class="f"><span class="l">Nhập lại mật khẩu</span><span class="inp"><input type="password" name="confirm" autocomplete="new-password" maxlength="128" required></span></label>
  <label class="chk"><input type="checkbox" name="ok" required><span>Tôi chỉ dùng Lantern để quét tài sản mà tôi sở hữu hoặc được phép kiểm tra bằng văn bản.</span></label>
  <button class="btn" id="go">Đăng ký</button>
 </form>
 <p class="alt">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
</div></main>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go'),pw=document.getElementById('pw'),eye=document.getElementById('eye'),meter=document.getElementById('meter');
function showErr(m,el){err.textContent=m;err.classList.add('show');document.querySelectorAll('input').forEach(i=>i.removeAttribute('aria-invalid'));if(el){el.setAttribute('aria-invalid','true');el.focus()}}
eye.onclick=()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.textContent=show?'Ẩn':'Hiện';eye.setAttribute('aria-pressed',show);eye.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu')};
function strength(p){if(!p)return 0;let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))s++;if(/^\d+$/.test(p))s=Math.min(s,1);return Math.max(1,Math.min(4,s))}
pw.addEventListener('input',()=>{meter.dataset.s=pw.value?strength(pw.value):0});
f.addEventListener('submit',async e=>{e.preventDefault();err.classList.remove('show');
 const name=f.name.value.trim(),username=f.username.value.trim().toLowerCase(),email=f.email.value.trim(),password=pw.value;
 if(!name)return showErr('Vui lòng nhập họ tên.',f.name);
 if(!/^[a-z0-9_.]{3,30}$/.test(username))return showErr('Tên đăng nhập gồm 3–30 ký tự: chữ cái, số, dấu _ hoặc .',f.username);
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email))return showErr('Email không hợp lệ.',f.email);
 if(password.length<8)return showErr('Mật khẩu phải có ít nhất 8 ký tự.',pw);
 if(password!==f.confirm.value)return showErr('Mật khẩu nhập lại không khớp.',f.confirm);
 if(!f.ok.checked)return showErr('Bạn cần xác nhận cam kết sử dụng hợp pháp.',f.ok);
 go.disabled=true;go.textContent='Đang gửi mã…';
 try{
  const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name,username,email,password})});
  if(r.ok){location.replace('/verify');return}
  let m='Đăng ký thất bại ('+r.status+').';try{const j=await r.json();if(typeof j.detail==='string')m=j.detail}catch(_){}
  showErr(m,r.status===409?(/tên đăng nhập/i.test(m)?f.username:f.email):null);
 }catch(_){showErr('Không kết nối được máy chủ. Kiểm tra lại server rồi thử lại.')}
 go.disabled=false;go.textContent='Đăng ký'});
</script>
</body>
</html>
